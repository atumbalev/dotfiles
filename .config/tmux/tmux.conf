# tmux config (XDG location: ~/.config/tmux/tmux.conf). Reload with: prefix r
# Keys are mirrored in .config/herdr/config.toml; keep the two in sync.

# Prefix: Ctrl-a (easier to reach than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal: true color + undercurl for Neovim
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Neovim-friendly: no Esc delay, focus events for autoread/auto-save
set -sg escape-time 10
set -g focus-events on

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g set-titles on
set -g display-time 2000

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"

# Splits open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind \; last-pane

# Vi copy mode: prefix [ to enter, v to select, y to copy to macOS clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour245]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour39,bold] #I:#W "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
set -g message-style "bg=default,fg=colour39"

# Same as herdr: prefix b toggles the bar, prefix M-g opens lazygit in a popup
bind b set status
bind M-g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
